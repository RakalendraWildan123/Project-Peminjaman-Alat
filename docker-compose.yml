services:
  # 1. SERVER DTABASE
  mysql-server:
    image: mysql:8.0
    container_name: MySQL-UJICOBA
    environment:
      MYSQL_DATABASE: API_ujikom
      MYSQL_USER: api_ujikom
      MYSQL_PASSWORD: api_ujikom
      MYSQL_ROOT_PASSWORD: passwordroot
    ports:
      - "3307:3306"
    networks:
      - API-UJIKOM
    volumes:
      - db_data:/var/lib/mysql
      - ./database_backup.sql:/docker-entrypoint-initdb.d/init.sql:ro

  # 2. SERVER BACKEND (LARAVEL)
  app-laravel:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: laravel-UJICOBA
    working_dir: /var/www
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/var/www
    command: sh -c "if [ ! -f .env ]; then cp .env.example .env; fi && if [ ! -f vendor/autoload.php ]; then composer install --no-interaction; fi && php artisan storage:link --force && php artisan serve --host=0.0.0.0 --port=8000"
    depends_on:
      - mysql-server
    networks:
      - API-UJIKOM
  # 3. SERVER IU DATABASE (PHPMYADMIN)
  phpMyadmin:
    image: phpmyadmin
    container_name: PhpMyadmin-UJICOBA
    environment:
      PMA_HOST: mysql-server
    ports:
      - "8081:80"
    depends_on:
      - mysql-server
    networks:
       - API-UJIKOM
volumes:
  db_data:
networks:
  API-UJIKOM:
    driver: bridge
      